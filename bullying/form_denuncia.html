<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Formulário de denúncia do S.I.D.A.</title>
        <meta charset="UTF=8">
        <link rel="formulario.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="form_denuncia.css">

    </head>

    <main>
        <form method="post" action="...">
            <div class="lugares">
                <label for="escola">Nome da escola:</label>
                <div class="inputs">
                    <i class="fa-solid fa-school"></i>
                    <input type="text" placeholder="Escreva o nome de sua escola(opcional)" required>
                </div>
            </div>

            <div class="lugares">
                <label for="lugar">Onde ocorreu?</label>
                <select>
                    <option value="dentro">Dentro da escola</option>
                    <option value="fora da escola">Fora da escola</option>
                    <option value="na internet">Na internet</option>
                    <option value="no trajeto da escola">No trajeto da escola</option>
                    <option value="nas proximidades da escola">Nas proximidades da escola</option>
                </select>
            </div>

            <div class="lugares">
                <label>Tipo de violencia</label>
                <select>
                    <option value="fisica">Fisica</option>
                    <option value="psicologica">Psicologica</option>
                    <option value="verbal">Verbal</option>
                    <option value="cyberbullying">Cyberbullying</option>
                    <option value="discriminação">Discriminação</option>
                </select>
            </div>

            <div class="lugares">
                <label>Alguem foi machucado fisicamente ou corre o risco de ser agredido a qualquer momento?</label>
                <select>
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

             <div class="lugares">
                <label>A situação envolve o uso de armas, facas, drogas ou ameaça de morte?</label>
                <select>
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div class="lugares">
                <label>A situação acontece de forma grave e frequente sem ajuda em casa, ou envolve abuso/exploração de um menor de idade?</label>
                <select>
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div class="lugares">
                <label>A situação acontece de forma grave e frequente sem ajuda em casa, ou envolve abuso/exploração de um menor de idade?</label>
                <select>
                    <option>Não</option>
                    <option>Sim</option>
                </select>
            </div>

            <div class="lugares">
                <label for="escola">Sala da(s) vitima(s):</label>
                <div class="inputs">
                    <i class="fa-solid fa-chalkboard"></i>
                    <input type="text" placeholder="Escreva a sala(opcional)" required>
                </div>
            </div>

            <div class="lugares">
                <label for="escola">Sala do(s) agressor(es):</label>
                <div class="inputs">
                    <i class="fa-solid fa-chalkboard"></i>
                    <input type="text" placeholder="Escreva a sala(opcional)" required>
                </div>
            </div>
            
        </form>
    </main>

</html>
