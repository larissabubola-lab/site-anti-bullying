<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Lorem ipsum</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    </head>

    <body>
        <header>
            <div id="logo_auxiliar">
                <img id="logo" src="assets/logo.png" alt="logo">
            </div>
            <h1 id="nome">S.I.D.A</h1> <!--Sistema Integrado de Denuncias Anonimas-->
            <div id="botoes_auxiliar">
                <h1>|</h1>
                <div id="botoes">
                    <button onclick="abrir_inicio()">Inicio</button>
                    <button onclick="abrir_sobre_nos()">Sobre nós</button>
                    <button onclick="abrir_como_denunciar()">Como denunciar</button>
                    <button onclick="abrir_contatos()">Contatos</button>
                </div>
                <h1>|</h1>
            </div>

            <div id="login_cadastro">
                <button id="login" class="entrar" onclick="abrir_login()">Entrar</button>
                <button id="cadastro" class="entrar" onclick="abrir_cadastro()">Criar&nbsp;conta</button>
            </div>
        </header>

        <main>
            <section id="inicio">
                <h1>Aqui vai ficar o inicio.</h1>
            </section>

            <section id="sobre_nos" style="display: none;">
                <h1>Aqui vai ficar a pagina sobre nós</h1>
            </section>

            <section id="sobre_nos" style="display: none;">
                <h1>Aqui vai ficar a pagina sobre nós</h1>
            </section>

            <section id="como_denunciar" style="display: none;">
                <h1>Aqui vai ficar a pagina como denunciar</h1>
            </section>

            <section id="contatos" style="display: none;">
                <h1>Aqui vai ficar a pagina de contatos</h1>
            </section>
        </main>

        <div id="pagina_cadastro" style="display: none;" class="animate__animated animate__zoomIn">
            <h1 class="h1">Cadastro</h1>
            <form id="corpo_cadastro" method="post" action="...">
                <div class="labels">
                    <label for="nome">Escreva seu nome completo</label>
                    <span class="inputs">
                        <i class="bi bi-person"></i>
                        <input type="text" placeholder="Escreva seu nome completo" name="nome" required>
                    </span>    
                </div>

                <div class="labels">
                    <label for="email">Escreva seu email</label>
                    <span class="inputs">
                        <i class="bi bi-envelope"></i>
                        <input type="email" placeholder="Escreva seu email" name="email" required>
                    </span>
                </div>

                <div class="labels">
                    <label for="senha">Escreva sua senha:</label>
                    <span class="inputs">
                        <i class="bi bi-lock"></i>
                        <input type="password" placeholder="escreva sua senha" name="senha" required>
                    </span>
                </div>

                <div class="labels">
                    <label for="data">Escreva seu aniversário:</label>
                    <span class="inputs">
                        <!-- <i class="bi bi-calendar"></i> -->
                        <input type="date" placeholder="Selecione sua data nascimento" name="data">
                    </span>
                </div>

                <div class="labels">
                    <label for="genero">Selecione o seu genero:</label>
                    <select>
                        <option>Prefiro não informar</option>
                        <option>Feminino</option>
                        <option>Masculino</option>
                        <option>Outro</option>
                    </select>
                </div>

                <div id="botoes_cadastro">
                    <button type="submit" id="fazer_cadastro">Criar conta</button>
                    <button id="cancelar_cadastro" onclick="fechar_cadastro()">Cancelar</button>
                </div>

            </form>
        </div>

        <div id="pagina_login" style="display: none;" class="animate__animated animate__zoomIn">
            <h1 class="h1">Login</h1>
            <form id="corpo_login" method="post" action="...">
                <div class="labels">
                    <label for="nome_login">Nome:</label>
                    <div class="inputs">
                        <i class="bi bi-person"></i>
                        <input type="text" placeholder="Escreva seu nome completo" name="nome_login" required>
                    </div>
                </div>

                <div class="labels">
                    <label for="email">Escreva seu email</label>
                    <span class="inputs">
                        <i class="bi bi-envelope"></i>
                        <input type="email" placeholder="Escreva seu email" name="email" required>
                    </span>
                </div>

                <div class="labels">
                    <label for="senha">Escreva sua senha:</label>
                    <span class="inputs">
                        <i class="bi bi-lock"></i>
                        <input type="password" placeholder="escreva sua senha" name="senha" required>
                    </span>
                </div>

                <div id="botoes_login">
                    <button type="submit" id="fazer_login">Fazer login</button>
                    <button id="cancelar_login" onclick="fechar_login()">Cancelar</button>
                </div>
            </form>

            <h3 id="esqueci_senha">Esqueci minha senha</h3>
        </div>

        <script src="script.js"></script>
    </body>
</html>
