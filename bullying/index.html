<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Lorem ipsum</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    </head>

    <body>
        <header>
            <div id="logo_auxiliar">
                <img id="logo" src="assets/logo_2.png" alt="logo">
            </div>
            <h1 id="nome">Lorem ipsum</h1>
            <div id="botoes_auxiliar">
                <h1>|</h1>
                <div id="botoes">
                    <button>Lorem ipsum</button>
                    <button>Lorem</button>
                    <button>Ipsum</button>
                </div>
                <h1>|</h1>
            </div>

            <div id="login_cadastro">
                <button id="login" class="entrar">Entrar</button>
                <button id="cadastro" class="entrar" onclick="abrir_cadastro()">Criar&nbsp;conta</button>
            </div>
        </header>

        <main>
            <section id="conteudo">
                <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque molestiae et similique, at provident est nulla officia nesciunt deleniti voluptatum quis obcaecati amet nemo. Quidem sunt vitae quas itaque rerum.</h1>
            </section>
        </main>

        <div id="pagina_cadastro" style="display: none;" class="animate__animated animate__zoomIn">
            <h1>Cadastro</h1>
            <form id="corpo_cadastro" method="post" action="...">
                <div class="labels">
                    <label for="nome">Escreva seu nome completo</label>
                    <span class="inputs">
                        <i class="bi bi-person"></i>
                        <input type="text" placeholder="Escreva seu nome completo" name="nome" required>
                    </span>    
                </div>

                <div class="labels">
                    <label for="email">Escreva seu email</label>
                    <span class="inputs">
                        <i class="bi bi-envelope"></i>
                        <input type="email" placeholder="Escreva seu email" name="email" required>
                    </span>
                </div>

                <div class="labels">
                    <label for="senha">Escreva sua senha:</label>
                    <span class="inputs">
                        <i class="bi bi-lock"></i>
                        <input type="password" placeholder="escreva sua senha" name="senha" required>
                    </span>
                </div>

                <div class="labels">
                    <label for="data">Escreva seu aniversário:</label>
                    <span class="inputs">
                        <!-- <i class="bi bi-calendar"></i> -->
                        <input type="date" placeholder="Selecione sua data nascimento" name="data">
                    </span>
                </div>

                <div class="labels">
                    <label for="genero">Selecione o seu genero:</label>
                    <select>
                        <option>Prefiro não informar</option>
                        <option>Feminino</option>
                        <option>Masculino</option>
                        <option>Outro</option>
                    </select>
                </div>

                <div id="botoes_cadastro">
                    <button type="submit" id="fazer_cadastro">Fazer login</button>
                    <button id="cancelar_cadastro" onclick="fechar_cadastro()">Cancelar</button>
                </div>

            </form>
        </div>

        <!-- <div id="pagina_login"></div> -->

        <script src="script.js"></script>
    </body>
</html>
